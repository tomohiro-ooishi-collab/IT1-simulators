<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>パケット通信シミュレータ</title><link rel="stylesheet" href="../style.css"><header><a href="../index.html">←　授業用シミュレータ</a></header><main><h1>パケット通信シミュレータ</h1><div class="controls"><label>同時通信 <select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select> 組</label><button class="primary" id="play">送信開始</button><button id="reset">リセット</button><label>速度 <select id="speed"><option value=".5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option><option value="4">4倍</option></select></label></div><section><div class="controls"><h2>ネットワーク</h2><span class="info" id="status"></span></div><div class="map"><svg id="map" viewBox="0 0 1220 360" aria-label="送信端末、ルータ、受信端末と通信回線"></svg></div><small>線を選ぶと回線を切断・復旧できます。破線は切断中です。</small><p><small>ルータの枠内にある札が転送待ちです。右上が先頭で、札は右から左、上段から下段の順に並びます。「＋」は表示枠に収まらない枚数です。</small></p></section><section><h2>送信メッセージと受信記録</h2><small>1文字を1パケットとして送ります。各文字の上の数字は順序番号です。</small><div id="pairs"></div></section></main><script src="model.js"></script><script src="app.js"></script></html>
